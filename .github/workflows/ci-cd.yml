name: CI and CD

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Build and test application
    runs-on: ubuntu-latest
    env:
      DB_URL: jdbc:mysql://127.0.0.1:3306/todo_db
      DB_USERNAME: root
      DB_PASSWORD: ci-test-password
      COHERE_API_KEY: ci-placeholder
      SLACK_WEBHOOK_URL: ci-placeholder
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-test-password
          MYSQL_DATABASE: todo_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-test-password --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Test backend
        working-directory: Backend/todo-summary-assistant
        run: bash ./mvnw -B test

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: Frontend/todo/package-lock.json

      - name: Install and test frontend
        working-directory: Frontend/todo
        run: |
          npm ci
          CI=true npm test -- --watchAll=false --passWithNoTests

      - name: Build frontend
        working-directory: Frontend/todo
        run: npm run build

  publish-images:
    name: Build and push Docker Hub images
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t "$DOCKERHUB_USERNAME/todo-summary-backend:$IMAGE_TAG" \
            -t "$DOCKERHUB_USERNAME/todo-summary-backend:latest" \
            ./Backend/todo-summary-assistant
          docker push "$DOCKERHUB_USERNAME/todo-summary-backend:$IMAGE_TAG"
          docker push "$DOCKERHUB_USERNAME/todo-summary-backend:latest"

      - name: Build and push frontend image
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build --build-arg REACT_APP_API_URL= \
            -t "$DOCKERHUB_USERNAME/todo-summary-frontend:$IMAGE_TAG" \
            -t "$DOCKERHUB_USERNAME/todo-summary-frontend:latest" \
            ./Frontend/todo
          docker push "$DOCKERHUB_USERNAME/todo-summary-frontend:$IMAGE_TAG"
          docker push "$DOCKERHUB_USERNAME/todo-summary-frontend:latest"

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: publish-images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy through Systems Manager Run Command
        env:
          EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          deploy_script=$(cat <<EOF
          set -euo pipefail
          APP_DIR=/opt/todo-app
          REPO=https://github.com/Pragathi-0120/TodoSummaryAssistant.git
          mkdir -p "\$APP_DIR"
          if [ ! -d "\$APP_DIR/.git" ]; then
            git clone --no-checkout "\$REPO" "\$APP_DIR"
          fi
          git -C "\$APP_DIR" fetch --depth=1 origin '$IMAGE_TAG'
          git -C "\$APP_DIR" checkout --detach FETCH_HEAD
          cd "\$APP_DIR"
          AWS_REGION='$AWS_REGION' DOCKERHUB_USERNAME='$DOCKERHUB_USERNAME' bash ./scripts/deploy.sh '$IMAGE_TAG'
          EOF
          )
          jq -n --arg command "$deploy_script" '{commands: [$command]}' > "$RUNNER_TEMP/ssm-parameters.json"
          command_id=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy TodoSummaryAssistant $IMAGE_TAG" \
            --timeout-seconds 1800 \
            --parameters "file://$RUNNER_TEMP/ssm-parameters.json" \
            --query 'Command.CommandId' --output text)
          echo "SSM command: $command_id"

          for attempt in $(seq 1 180); do
            status=$(aws ssm get-command-invocation \
              --command-id "$command_id" --instance-id "$EC2_INSTANCE_ID" \
              --query Status --output text 2>/dev/null || true)
            case "$status" in
              Success) break ;;
              Failed|Cancelled|TimedOut|Cancelling|Undeliverable|Terminated)
                echo "SSM deployment finished with status: $status"
                aws ssm get-command-invocation --command-id "$command_id" \
                  --instance-id "$EC2_INSTANCE_ID" --query StandardOutputContent --output text || true
                aws ssm get-command-invocation --command-id "$command_id" \
                  --instance-id "$EC2_INSTANCE_ID" --query StandardErrorContent --output text || true
                exit 1 ;;
              *) sleep 10 ;;
            esac
          done

          if [ "$status" != Success ]; then
            echo "Timed out waiting for SSM command $command_id (last status: $status)"
            exit 1
          fi
          aws ssm list-command-invocations --command-id "$command_id" --details --output text
          aws ssm get-command-invocation --command-id "$command_id" \
            --instance-id "$EC2_INSTANCE_ID" --query StandardOutputContent --output text
          aws ssm get-command-invocation --command-id "$command_id" \
            --instance-id "$EC2_INSTANCE_ID" --query StandardErrorContent --output text
