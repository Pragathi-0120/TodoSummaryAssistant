groups:
  - name: todo-summary-alerts
    rules:
      - alert: BackendServiceDown
        expr: up{job="todo-summary-backend"} == 0 or absent(up{job="todo-summary-backend"})
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Backend service is down
          description: Prometheus has not scraped the backend successfully for 2 minutes.

      - alert: High5xxErrorRate
        expr: |
          sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m]))
          / clamp_min(sum(rate(http_server_requests_seconds_count[5m])), 1e-9) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Backend 5xx rate is above 5 percent
          description: More than 5 percent of backend HTTP requests returned 5xx responses for 5 minutes.

      - alert: HighHostCPU
        expr: 100 * (1 - avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m]))) > 85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Host CPU usage is above 85 percent
          description: Average host CPU usage has exceeded 85 percent for 10 minutes.

      - alert: LowHostDiskSpace
        expr: |
          100 * node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|rootfs|squashfs|9p"}
          / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|rootfs|squashfs|9p"} < 15
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Host disk has less than 15 percent free
          description: A host filesystem has had less than 15 percent free space for 10 minutes.
